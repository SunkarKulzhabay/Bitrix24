<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная — Офис CRM</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header class="topbar"></header>

  <main class="page page-wide">
    <h1 id="greeting"></h1>
    <p id="user-role" class="muted"></p>

    <section class="stats" aria-label="Сводка">
      <div class="stat"><span id="stat-tasks" class="stat-value">–</span><span class="stat-label">Задач в работе</span></div>
      <div id="stat-overdue-box" class="stat"><span id="stat-overdue" class="stat-value">–</span><span class="stat-label">Просрочено</span></div>
      <div class="stat"><span id="stat-review" class="stat-value">–</span><span class="stat-label">Ждут моей проверки</span></div>
      <div class="stat"><span id="stat-docs" class="stat-value">–</span><span class="stat-label">Документов на одобрении</span></div>
      <div class="stat"><span id="stat-projects" class="stat-value">–</span><span class="stat-label">Проектов в работе</span></div>
    </section>

    <div class="dash-grid">
      <section class="card">
        <h2>Мои задачи</h2>
        <div id="my-tasks"></div>
        <p class="card-link"><a href="/tasks.html">Все задачи</a></p>
      </section>

      <section class="card">
        <h2>Ждут моей проверки</h2>
        <div id="review-tasks"></div>
        <p class="card-link"><a href="/tasks.html">Открыть задачи</a></p>
      </section>

      <section class="card">
        <h2>Ближайшие 7 дней</h2>
        <div id="upcoming"></div>
        <p class="card-link"><a href="/calendar.html">Открыть календарь</a></p>
      </section>

      <section class="card">
        <h2>Документы на одобрении у меня</h2>
        <div id="approval-docs"></div>
        <p class="card-link"><a href="/documents.html">Все документы</a></p>
      </section>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
