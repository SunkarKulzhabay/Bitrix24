<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Документы — Офис CRM</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header class="topbar">
    <div><a href="/dashboard.html">← Главная</a></div>
    <div class="topbar-user">
      <span id="user-name"></span>
      <button id="logout-button" type="button" class="button-secondary">Выйти</button>
    </div>
  </header>

  <main class="page page-wide">
    <h1>Документы</h1>

    <section class="card">
      <h2>Создать документ</h2>
      <form id="document-form" novalidate>
        <div class="form-grid">
          <div class="span-2">
            <label for="d-template">Шаблон</label>
            <select id="d-template"></select>
          </div>
        </div>
        <div id="d-fields" class="form-grid fields-box"></div>
        <label class="checkbox-row">
          <input type="checkbox" name="with_stamp"> С печатью
        </label>
        <p id="document-error" class="form-error" role="alert"></p>
        <button type="submit">Создать документ</button>
      </form>
    </section>

    <nav class="tabs" aria-label="Списки документов">
      <button type="button" class="tab active" data-view="mine">Мои документы</button>
      <button type="button" class="tab" data-view="approval">На одобрении у меня</button>
    </nav>

    <section id="documents-list" class="tasks-list"></section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/documents.js"></script>
</body>
</html>
