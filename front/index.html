<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Офис CRM</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <main class="login">
    <section class="login-brand">
      <h1>Офис CRM</h1>
      <p>Задачи, проекты, документы и зарплата в одном месте.</p>
    </section>

    <section class="login-panel">
      <form id="login-form" class="login-form" novalidate>
        <h2>Вход в систему</h2>

        <label for="login-input">Логин</label>
        <input id="login-input" name="login" type="text" autocomplete="username" required autofocus>

        <label for="password-input">Пароль</label>
        <input id="password-input" name="password" type="password" autocomplete="current-password" required>

        <p id="login-error" class="form-error" role="alert"></p>

        <button id="login-button" type="submit">Войти</button>
        <p class="form-hint">Нет доступа? Логин и пароль выдаёт администратор.</p>
      </form>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
