<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задачи — Офис CRM</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header class="topbar">
    <div><a href="/dashboard.html">← Главная</a></div>
    <div class="topbar-user">
      <span id="user-name"></span>
      <button id="logout-button" type="button" class="button-secondary">Выйти</button>
    </div>
  </header>

  <main class="page page-wide">
    <h1>Задачи</h1>

    <section class="card">
      <h2>Новая задача</h2>
      <form id="task-form" novalidate>
        <div class="form-grid">
          <div class="span-2">
            <label for="t-title">Название</label>
            <input id="t-title" name="title" type="text" required>
          </div>
          <div>
            <label for="t-assignee">Исполнитель</label>
            <select id="t-assignee" name="assignee_id"></select>
          </div>
          <div>
            <label for="t-supervisor">Руководитель задачи (необязательно)</label>
            <select id="t-supervisor" name="supervisor_id"></select>
          </div>
          <div>
            <label for="t-priority">Срочность</label>
            <select id="t-priority" name="priority">
              <option value="urgent_important">Срочно и важно</option>
              <option value="important_not_urgent" selected>Важно, не срочно</option>
              <option value="urgent_not_important">Срочно, не важно</option>
              <option value="not_urgent_not_important">Не срочно, не важно</option>
            </select>
          </div>
          <div>
            <label for="t-deadline">Срок</label>
            <input id="t-deadline" name="deadline" type="datetime-local">
          </div>
          <div class="span-all">
            <label for="t-description">Описание</label>
            <textarea id="t-description" name="description" rows="3"></textarea>
          </div>
          <div>
            <button type="submit">Поставить задачу</button>
          </div>
        </div>
        <p id="task-error" class="form-error" role="alert"></p>
      </form>
    </section>

    <nav class="tabs" aria-label="Список задач">
      <button type="button" class="tab active" data-view="all">Все мои</button>
      <button type="button" class="tab" data-view="assigned">Мне поставили</button>
      <button type="button" class="tab" data-view="created">Я поставил</button>
    </nav>

    <section id="tasks-list" class="tasks-list"></section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/tasks.js"></script>
</body>
</html>
