<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профиль — Офис CRM</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header class="topbar"></header>

  <main class="page">
    <h1>Профиль</h1>

    <section class="card">
      <dl id="profile-info" class="info-list"></dl>
    </section>

    <section class="card">
      <h2>Смена пароля</h2>
      <form id="password-form" class="side-form profile-form" novalidate>
        <label for="current-password">Текущий пароль</label>
        <input id="current-password" name="current" type="password" autocomplete="current-password" required>

        <label for="new-password">Новый пароль (от 8 символов)</label>
        <input id="new-password" name="new" type="password" autocomplete="new-password" required>

        <label for="repeat-password">Повторите новый пароль</label>
        <input id="repeat-password" name="repeat" type="password" autocomplete="new-password" required>

        <p id="password-error" class="form-error" role="alert"></p>
        <p id="password-ok" class="form-ok" role="status"></p>
        <button type="submit">Сменить пароль</button>
      </form>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
